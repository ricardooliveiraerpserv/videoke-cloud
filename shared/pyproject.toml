[project]
name = "kk-shared"
version = "0.1.0"
description = "Contratos, eventos, SDK e utilidades compartilhadas do ecossistema"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "cryptography>=42.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kk_shared"]
