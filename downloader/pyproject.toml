[project]
name = "kk-downloader"
version = "0.1.0"
description = "Video Downloader — pesquisa, baixa, converte e cataloga no Library Core"
requires-python = ">=3.12"
dependencies = [
    "kk-shared",
    "kk-core",
    "yt-dlp>=2025.1",
    "imageio-ffmpeg>=0.5",
    "PySide6>=6.6",
]

[project.scripts]
kk-download = "kk_downloader.cli:main"
kk-downloader-gui = "kk_downloader.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kk_downloader"]

[tool.uv.sources]
kk-shared = { workspace = true }
kk-core = { workspace = true }
