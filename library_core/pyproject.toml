[project]
name = "kk-core"
version = "0.1.0"
description = "Library Core — única porta de acesso a dados e arquivos do ecossistema"
requires-python = ">=3.12"
dependencies = [
    "kk-shared",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "segno>=1.6",
    "watchdog>=4.0",
    "imageio-ffmpeg>=0.5",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
kk-libraryd = "kk_core.service.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kk_core"]

[tool.uv.sources]
kk-shared = { workspace = true }
